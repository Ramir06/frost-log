{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — Frost</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/templatemo-frost-style.css' %}">

  <style>
    
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--cream);
      font-family: var(--font-body);
    }

    .login-wrap {
      display: flex;
      width: min(900px, 95vw);
      min-height: 540px;
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-hover);
      overflow: hidden;
    }

    /* Левая декоративная панель */
    .login-deco {
      flex: 1;
      background: linear-gradient(145deg, var(--terracotta) 0%, var(--terracotta-dark) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
      position: relative;
      overflow: hidden;
    }

    .login-deco::before,
    .login-deco::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      opacity: 0.15;
      background: var(--cream);
    }
    .login-deco::before {
      width: 280px; height: 280px;
      top: -80px; right: -80px;
    }
    .login-deco::after {
      width: 180px; height: 180px;
      bottom: -50px; left: -50px;
    }

    .login-deco__scoops {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      position: relative;
      z-index: 1;
    }

    .deco-scoop {
      width: 64px; height: 64px;
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      position: relative;
    }
    .deco-scoop::after {
      content: '';
      position: absolute;
      top: 12px; left: 14px;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: rgba(255,255,255,0.35);
    }
    .deco-scoop--1 { background: #f7c9b3; transform: translateY(8px); }
    .deco-scoop--2 { background: #c9e8d8; }
    .deco-scoop--3 { background: #fde9a2; transform: translateY(8px); }

    .login-deco__logo {
      font-family: var(--font-heading);
      font-size: 2.6rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -1px;
      position: relative;
      z-index: 1;
    }
    .login-deco__logo span { color: var(--cream); opacity: 0.6; }

    .login-deco__tagline {
      color: rgba(255,255,255,0.8);
      font-size: 0.95rem;
      text-align: center;
      margin-top: 0.6rem;
      max-width: 200px;
      line-height: 1.5;
      position: relative;
      z-index: 1;
    }

    /* Правая панель — форма */
    .login-form-panel {
      flex: 1.1;
      background: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(2rem, 5vw, 3.5rem);
    }

    .login-form-panel__title {
      font-family: var(--font-heading);
      font-size: clamp(1.6rem, 3vw, 2.1rem);
      color: var(--navy);
      font-weight: 600;
      margin-bottom: 0.4rem;
    }
    .login-form-panel__sub {
      color: var(--navy-light);
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }

    /* Сообщения об ошибках */
    .login-error {
      background: #fef2f2;
      border: 1px solid #fca5a5;
      border-radius: var(--radius-sm);
      color: #b91c1c;
      font-size: 0.875rem;
      padding: 0.75rem 1rem;
      margin-bottom: 1.25rem;
    }

    /* Поля формы */
    .form-group {
      margin-bottom: 1.25rem;
    }
    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--navy-light);
      margin-bottom: 0.45rem;
    }
    .form-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 2px solid var(--cream-dark);
      border-radius: var(--radius-sm);
      font-family: var(--font-body);
      font-size: 0.95rem;
      color: var(--navy);
      background: var(--cream);
      transition: border-color 0.25s, box-shadow 0.25s;
      outline: none;
    }
    .form-group input:focus {
      border-color: var(--terracotta);
      box-shadow: 0 0 0 3px rgba(224, 122, 95, 0.15);
      background: #fff;
    }

    /* Кнопка входа */
    .btn-login {
      width: 100%;
      padding: 0.85rem;
      background: var(--terracotta);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-family: var(--font-body);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.25s, transform 0.15s, box-shadow 0.25s;
      margin-top: 0.5rem;
      letter-spacing: 0.02em;
    }
    .btn-login:hover {
      background: var(--terracotta-dark);
      box-shadow: 0 4px 18px rgba(224, 122, 95, 0.35);
      transform: translateY(-1px);
    }
    .btn-login:active { transform: translateY(0); }

    /* Ссылка назад */
    .login-back {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      margin-top: 1.5rem;
      font-size: 0.875rem;
      color: var(--navy-light);
      text-decoration: none;
      transition: color 0.2s;
    }
    .login-back:hover { color: var(--terracotta); }
    .login-back svg { width: 14px; height: 14px; }

    /* Адаптив */
    @media (max-width: 600px) {
      .login-deco { display: none; }
      .login-wrap { min-height: auto; }
    }
  </style>
</head>
<body>

  <div class="login-wrap">

   
    <div class="login-deco">
      <div class="login-deco__scoops" aria-hidden="true">
        <div class="deco-scoop deco-scoop--1"></div>
        <div class="deco-scoop deco-scoop--2"></div>
        <div class="deco-scoop deco-scoop--3"></div>
      </div>
      <div class="login-deco__logo">Fr<span>o</span>st</div>
      <p class="login-deco__tagline">Холодные лакомства для тёплых сердец</p>
    </div>

    <!-- Форма -->
    <div class="login-form-panel">
      <h1 class="login-form-panel__title">Добро пожаловать!</h1>
      <p class="login-form-panel__sub">Войдите в свой аккаунт, чтобы продолжить</p>

      {% if error %}
      <div class="login-error">{{ error }}</div>
      {% endif %}

      <form method="post" action="{% url 'login' %}">
        {% csrf_token %}

        <div class="form-group">
          <label for="username">Имя пользователя</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Введите имя пользователя"
            value="{{ username|default:'' }}"
            autocomplete="username"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Пароль</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Введите пароль"
            autocomplete="current-password"
            required
          >
        </div>

        <button type="submit" class="btn-login">Войти</button>
      </form>

      <a href="{% url 'index' %}" class="login-back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
        Вернуться на главную
      </a>
    </div>

  </div>

</body>
</html>
